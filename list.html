<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>探索 | Outfit Preview Studio</title>
  <meta name="description" content="浏览 Outfit Preview Studio 的分类筛选和 AI 模特上身预览。">
  <link rel="stylesheet" href="styles.css?v=20260521-favremove">
  <script src="script.js?v=20260521-favremove" defer></script>
</head>
<body data-page="list">
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Outfit Preview Studio 首页">Outfit Preview Studio</a>
      <nav class="topnav" aria-label="主导航">
        <a href="#saved-looks" data-action="open-favorites">灵感</a>
      </nav>
    </header>

    <main>
      <section class="lookbook-section" id="lookbook" aria-labelledby="lookbook-title">
        <div class="list-heading">
          <h1 id="lookbook-title">探索</h1>
          <p class="list-subtitle">发现每一天的穿搭灵感</p>
          <p class="list-subtitle list-subtitle-en">Discover Daily Outfit Inspiration</p>
          <label class="search-box" for="outfit-search">
            <span class="sr-only">搜索穿搭</span>
            <input id="outfit-search" type="search" placeholder="搜索单品、季节、风格、场景、标签" aria-label="搜索单品、季节、风格、场景、标签">
          </label>
        </div>

        <div class="filter-strip" id="category-filters" aria-label="分类筛选"></div>
        <div class="status-message" id="list-status" aria-live="polite"></div>
        <div class="outfit-grid" id="outfit-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      这是一个使用 HTML、CSS、JavaScript、Codex 和 GitHub Pages 构建的移动端优先服装图册项目。
    </footer>
  </div>
</body>
</html>
